services:
  postgres:
    # paradedb/paradedb:latest-pg16 ships pgvector >= 0.8.0 + pg_search (BM25) — INFRA-02, INFRA-03
    # Note: tag is latest-pg16 (not pg16) — ParadeDB tagging convention
    image: paradedb/paradedb:latest-pg16
    container_name: gsd-postgres
    restart: unless-stopped
    # INFRA-03: pg_search requires shared_preload_libraries — set via postgres command args
    command: postgres -c shared_preload_libraries=pg_search
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gsd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gsd}
      POSTGRES_DB: gsd_amauta
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gsd-pg-data:/var/lib/postgresql/data
      - ../migrations/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ../migrations/002-embedding-index.sql:/docker-entrypoint-initdb.d/002-embedding-index.sql:ro
      - ../migrations/003-embedding-1024.sql:/docker-entrypoint-initdb.d/003-embedding-1024.sql:ro
      - ../migrations/004-fulltext-indexes.sql:/docker-entrypoint-initdb.d/004-fulltext-indexes.sql:ro
      - ../migrations/005-agent-performance.sql:/docker-entrypoint-initdb.d/005-agent-performance.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsd -d gsd_amauta"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    # Valkey 8.x — BSD 3-Clause license (drop-in Redis 7 replacement, INFRA-01)
    image: valkey/valkey:8-alpine
    container_name: gsd-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  amauta-mcp:
    # Phase 29 MCP-01: MCP server — stdio (Claude Code) + SSE (port 18800)
    image: python:3.12-slim
    container_name: gsd-mcp
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install mcp>=1.0 --quiet &&
             python3 services/amauta-mcp.py --sse"
    environment:
      AMAUTA_DAEMON_URL: "http://host.docker.internal:18799"
      AMAUTA_RLM_URL: "http://host.docker.internal:18798"
      AMAUTA_MCP_PORT: "18800"
    ports:
      - "127.0.0.1:18800:18800"
    volumes:
      - .:/app:ro
    depends_on:
      - postgres

volumes:
  gsd-pg-data:
    name: gsd-pg-data
