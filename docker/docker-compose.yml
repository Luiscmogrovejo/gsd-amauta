services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gsd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gsd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gsd}
      POSTGRES_DB: gsd_amauta
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gsd-pg-data:/var/lib/postgresql/data
      - ../migrations/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ../migrations/002-embedding-index.sql:/docker-entrypoint-initdb.d/002-embedding-index.sql:ro
      - ../migrations/003-embedding-1024.sql:/docker-entrypoint-initdb.d/003-embedding-1024.sql:ro
      - ../migrations/004-fulltext-indexes.sql:/docker-entrypoint-initdb.d/004-fulltext-indexes.sql:ro
      - ../migrations/005-agent-performance.sql:/docker-entrypoint-initdb.d/005-agent-performance.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsd -d gsd_amauta"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  gsd-pg-data:
    name: gsd-pg-data
