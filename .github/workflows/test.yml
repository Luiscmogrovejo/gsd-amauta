name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# ── Hermetic guard rollout, plan 88-16-03: STEP 2 of 2, ENFORCE ─────────────
# Step 1 was one full run across nine cells with `GSD_HERMETIC_GUARD_MODE: log`
# at workflow level (run 43173591322). Its refusal log — printed by both
# runners at the end of a run — is the network-reach inventory in
# 88-16-RECORD.md. Measured non-loopback destinations: registry.npmjs.org
# (npx probing for eslint, closed by npm_config_offline), api.duckduckgo.com
# (the MCP research tool's best-effort web fetch), huggingface.co and its CDN
# (sentence-transformers fetching a model), api.voyageai.com (the embedding
# provider) and 203.0.113.9 (this plan's own TEST-NET-3 mutation case).
# NOT ONE of them is a test that legitimately must download, so the allow-list
# stays EMPTY: the only host allowance in the whole suite is the one task
# 88-16-08 scopes to the Voyage test. The key is therefore gone and the
# default — enforce — applies.

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ !matrix.required }}

    strategy:
      # Source of the matrix decision: .planning/phases/88-foundation-hermetic-ci/88-CONTEXT.md
      # (locked 2026-11-11). Node 18 is gone: package.json engines.node is
      # >=20 and Node 18 is end of life.
      #
      # EVERY cell is required. Operator decision 2026-11-11: "All needs to
      # pass even windows so don't skip tests, make them all work, this is a
      # universal tool." Windows is a SUPPORTED PLATFORM, not a best-effort
      # one: plans 88-13, 88-14 and 88-15 drove its failing set from 332 to
      # zero, and plan 88-15 made the two Windows cells blocking so it cannot
      # drift back. fail-fast is off so one red cell cannot cancel (and hide)
      # the others.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node-version: 20, required: true }
          - { os: ubuntu-latest, node-version: 22, required: true }
          - { os: macos-latest, node-version: 20, required: true }
          - { os: macos-latest, node-version: 22, required: true }
          - { os: windows-latest, node-version: 22, required: true }
          - { os: windows-latest, node-version: 20, required: true }

    steps:
      - name: Check out with LF line endings (88-13, research G4)
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the party/phase canary tests run `git show <sha>`
          # against historical commits and fail on the default depth-1 clone.
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The Node tests shell out to python3 and need PyYAML and pydantic (module
      # manifest hashing and validation). The runners' system Python is PEP 668
      # "externally managed" (a bare pip install fails) and windows-latest may
      # have no python3 on PATH, so give the job its own Python first. Same SHA
      # pin as the pytest job.
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'

      - name: Pin GSD_PYTHON to the setup-python interpreter
        shell: bash
        # Plan 88-16-06/-07. The Node tests resolve Python through
        # get-shit-done/bin/lib/platform.cjs, whose candidate order on Windows
        # is `py -3`, then `python`, then `python3` — and `py -3` can be a
        # DIFFERENT interpreter from the setup-python one the step below
        # installs PyYAML into. That is the whole cause of the nine PyYAML
        # skips the Windows Node cells carried (module-lifecycle-cli 3,
        # module-lifecycle-e2e 6) and of the macOS one in
        # 88-12-agent-yaml-parses. GSD_PYTHON is the first candidate, so
        # pinning it makes the interpreter that runs the tests the same one the
        # packages were installed into, on all three systems.
        run: |
          set -euo pipefail
          PY=$(python -c "import sys; print(sys.executable)")
          echo "GSD_PYTHON=$PY" >> "$GITHUB_ENV"
          echo "GSD_PYTHON=$PY"

      - name: Install the Python packages the Node tests import
        shell: bash
        # Plan 88-16-07: from the FILE, not a loose unpinned list. The Node
        # tests shell out to services/*.py, so the interpreter they resolve
        # must carry what those modules import — PyYAML (10 skipped rows),
        # NumPy (2), psycopg2 (3) — and installing from requirements-dev.txt
        # is what stops the CI environment and a developer's from drifting.
        # Every version in that file is pinned exactly.
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Install the security scanners (gitleaks, trivy)
        shell: bash
        # Plan 88-16-07. Through the REPOSITORY'S OWN installers, not a
        # third-party action: they pin the version, resolve the asset per
        # platform and — since this plan — verify a pinned SHA-256 and fail
        # closed, so CI exercises the same code a user runs. The trivy pin had
        # to move: v0.50.1's tag and every asset under it now 404, so trivy
        # could not be installed anywhere. Eleven scanner skips depend on this
        # step; the job FAILS if a binary is not on PATH afterwards, because a
        # missing scanner that reports "unavailable" reads as a clean scan.
        run: |
          set -euo pipefail
          node scripts/install-gitleaks.cjs
          node scripts/install-trivy.cjs
          export PATH="$PWD/node_modules/.bin:$PATH"
          # GITHUB_PATH is read by the RUNNER, not by bash. On Windows this step
          # runs in Git Bash, where $PWD is an MSYS path (/d/a/gsd-amauta/...)
          # that native processes cannot resolve — so the entry was accepted and
          # then matched nothing, and six scanner tests reported "not installed"
          # on both Windows cells while this step itself passed (measured, run
          # 43186745109). Write the native form.
          BIN_DIR="$PWD/node_modules/.bin"
          if command -v cygpath >/dev/null 2>&1; then
            BIN_DIR="$(cygpath -w "$BIN_DIR")"
          fi
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          missing=
          command -v gitleaks >/dev/null 2>&1 || missing="$missing gitleaks"
          command -v trivy    >/dev/null 2>&1 || missing="$missing trivy"
          if [ -n "$missing" ]; then
            echo "scanners missing from PATH after install:$missing" >&2
            exit 1
          fi
          gitleaks version
          trivy --version

      - name: Install semgrep where it is supported
        if: runner.os != 'Windows'
        shell: bash
        # `pipx`, not `pip install -r`: semgrep 1.183.0 depends on mcp==1.29.0
        # and this repository pins mcp==1.27.1 because services/amauta-mcp.py
        # targets the 1.x server API, so putting the two in one environment is
        # a ResolutionImpossible (measured, run 43177558577). pipx gives the
        # CLI its own virtualenv, which is what a CLI wants. The Windows
        # measurement is the step below, and
        # tests/88-16-fake-scanner.test.cjs covers the parsing and policy
        # behaviour on ALL nine cells regardless.
        run: |
          set -euo pipefail
          python -m pipx install "semgrep==1.183.0" || pipx install "semgrep==1.183.0"
          pipx ensurepath >/dev/null 2>&1 || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          semgrep --version

      - name: Measure semgrep on windows-latest (plan 88-16-07)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        # Research section 8 marks native semgrep on Windows LOW confidence.
        # This measures it instead of guessing, and cannot fail the cell.
        run: |
          echo "=== pipx install semgrep==1.183.0 on windows-latest"
          python -m pipx install "semgrep==1.183.0" 2>&1 | tail -30 || echo "(install failed)"
          echo "=== semgrep --version"
          semgrep --version 2>&1 || echo "(semgrep not runnable on this platform)"

      - name: Pick a free host port for the disposable PostgreSQL
        shell: bash
        # The runner's OWN helper, so the port can never be one of the live
        # service ports (freePort() excludes LIVE_PORTS by construction) and
        # nothing anywhere is hard-coded.
        run: |
          set -euo pipefail
          PORT=$(node -e "process.stdout.write(String(require('./scripts/run-tests.cjs').freePort()))")
          echo "PG_TEST_PORT=$PORT" >> "$GITHUB_ENV"
          echo "disposable PostgreSQL will listen on host port $PORT"

      - name: Probe the runner's PostgreSQL capability (macOS and Windows)
        if: runner.os != 'Linux'
        continue-on-error: true
        shell: bash
        # Plan 88-16-04 measures before it chooses. The research marks the
        # pgvector-on-Windows question LOW confidence and `ankane/setup-postgres`
        # MEDIUM; both are hypotheses, and this step is how they stop being
        # hypotheses. continue-on-error so a missing tool reports rather than
        # fails the cell.
        run: |
          echo "=== runner: ${{ runner.os }} / ${{ runner.arch }}"
          echo "--- postgres --version";  postgres --version  2>&1 || echo "(absent)"
          echo "--- pg_ctl --version";    pg_ctl --version    2>&1 || echo "(absent)"
          echo "--- initdb --version";    initdb --version    2>&1 || echo "(absent)"
          echo "--- pg_config --version"; pg_config --version 2>&1 || echo "(absent)"
          echo "--- pg_config --pkglibdir / --sharedir"
          pg_config --pkglibdir 2>&1 || true
          pg_config --sharedir 2>&1 || true
          echo "--- PGBIN=${PGBIN:-<unset>} PGROOT=${PGROOT:-<unset>} PGDATA=${PGDATA:-<unset>}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "--- brew list | grep -i postgres"; brew list 2>/dev/null | grep -i postgres || echo "(none)"
            echo "--- brew info pgvector";          brew info pgvector 2>&1 | head -5 || echo "(no formula)"
            echo "--- which psql";                  command -v psql || echo "(absent)"
          else
            echo "--- windows service state";       powershell -NoProfile -Command "Get-Service postgresql* | Format-Table -AutoSize" 2>&1 || true
            echo "--- nmake on PATH";               command -v nmake || echo "(absent)"
            echo "--- cl on PATH";                  command -v cl || echo "(absent)"
            echo "--- vswhere";                     "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath 2>&1 || echo "(absent)"
            echo "--- conda";                       command -v conda || echo "(absent)"
            echo "--- wsl";                         command -v wsl || echo "(absent)"
            echo "--- docker info OSType";          docker info --format '{{.OSType}}' 2>&1 || echo "(absent)"
          fi
          echo "=== end capability probe"

      # ── TEMPORARY, plan 89-07-01: MEASURE, never configure ──────────────────
      # Task 89-07-03 DELETES this step and replaces it with the permanent
      # `scripts/ci-postgres-cell.cjs` bring-up. Until then nothing here is
      # exported to $GITHUB_ENV, so every later step of the cell behaves exactly
      # as it does on master and this step only answers one question: can a
      # disposable PostgreSQL with `vector` be had on this runner at all?
      #
      # pgvector is pinned to 0.8.7 and verified against the SHA-256 that
      # Homebrew core publishes for the SAME tarball (Formula/p/pgvector.rb:
      # url + sha256). That is an INDEPENDENT record of the digest, not one
      # computed from the download being verified.
      - name: MEASURE a disposable PostgreSQL + pgvector (TEMPORARY, 89-07-01)
        if: runner.os != 'Linux'
        continue-on-error: true
        shell: bash
        env:
          PGV_VER: '0.8.7'
          PGV_SHA: 'cac0b10c360f05b2d521200105ba3697e773d4cd3731f5a915a7e37ebe0bea85'
        run: |
          set -uo pipefail
          echo "=== 89-07-01 measurement on ${{ runner.os }} / ${{ runner.arch }}"
          WORK="$RUNNER_TEMP/pg8907"
          rm -rf "$WORK"; mkdir -p "$WORK"
          t0=$SECONDS
          EXE=""

          if [ "${{ runner.os }}" = "macOS" ]; then
            export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1
            echo "--- route macOS-1: brew install postgresql@17 pgvector"
            if ! brew install postgresql@17 pgvector; then
              echo "MEASURE macos verdict=FAILS route=brew-install"; exit 0
            fi
            echo "MEASURE macos brew_seconds=$((SECONDS-t0))"
            BIN="$(brew --prefix postgresql@17)/bin"
            PKGLIB="$("$BIN/pg_config" --pkglibdir)"
            SHARE="$("$BIN/pg_config" --sharedir)"
            echo "MEASURE macos pg_config=$("$BIN/pg_config" --version)"
            echo "MEASURE macos homebrew_prefix=$(brew --prefix)"
            echo "MEASURE macos pkglibdir=$PKGLIB"
            echo "MEASURE macos sharedir=$SHARE"
            echo "MEASURE macos pgvector_brew=$(brew list --versions pgvector | tr '\n' ' ')"
            echo "MEASURE macos vector_module=$(ls "$PKGLIB" 2>/dev/null | grep -i '^vector\.' | tr '\n' ' ')"
            echo "MEASURE macos vector_control=$(ls "$SHARE/extension" 2>/dev/null | grep -i '^vector' | tr '\n' ' ')"
            echo "MEASURE macos pg_restore=$("$BIN/pg_restore" --version)"
          else
            EXE=".exe"
            PGROOT='C:\Program Files\PostgreSQL\17'
            BIN='/c/Program Files/PostgreSQL/17/bin'
            echo "--- route Windows-1: the PREINSTALLED PostgreSQL 17 binaries, a FRESH disposable cluster (NOT the stopped postgresql-x64-17 service: its cluster is not disposable and it would listen on 5432, not on the port freePort() chose)"
            if ! "$BIN/initdb.exe" --version; then
              echo "MEASURE windows verdict=FAILS route=1-initdb-absent"; exit 0
            fi
            for f in include/server/postgres.h lib/postgres.lib; do
              if [ -f "/c/Program Files/PostgreSQL/17/$f" ]; then
                echo "MEASURE windows devfile $f=present"
              else
                echo "MEASURE windows devfile $f=ABSENT"
              fi
            done
            echo "--- route Windows-2a: a prebuilt, digest-pinned pgvector for PG17 x64"
            echo "MEASURE windows route_2a=NOT USED -- github.com/pgvector/pgvector publishes source archives only; no release carries a Windows .zip or .dll asset, so NO artefact digest could be recorded, and an unverifiable artefact was not used"
            echo "--- route Windows-2b: nmake /F Makefile.win through vcvars64.bat located with vswhere"
            t1=$SECONDS
            curl -fsSL --retry 3 --retry-all-errors -o "$WORK/pgvector.tar.gz" \
              "https://github.com/pgvector/pgvector/archive/refs/tags/v${PGV_VER}.tar.gz"
            echo "MEASURE windows pgvector_sha256_measured=$(sha256sum "$WORK/pgvector.tar.gz" | cut -d' ' -f1)"
            echo "MEASURE windows pgvector_sha256_pinned=$PGV_SHA"
            if ! printf '%s  %s\n' "$PGV_SHA" "$WORK/pgvector.tar.gz" | sha256sum -c -; then
              echo "MEASURE windows verdict=FAILS route=2b-digest-mismatch"; exit 0
            fi
            tar -xzf "$WORK/pgvector.tar.gz" -C "$WORK"
            SRC="$WORK/pgvector-${PGV_VER}"
            VSWHERE='/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
            VSPATH="$("$VSWHERE" -latest -products '*' \
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
              -property installationPath | tr -d '\r')"
            echo "MEASURE windows vs_installationPath=$VSPATH"
            {
              printf '@echo off\r\n'
              printf 'call "%%VSPATH%%\\VC\\Auxiliary\\Build\\vcvars64.bat" >nul\r\n'
              printf 'if errorlevel 1 exit /b 1\r\n'
              printf 'set "PGROOT=%s"\r\n' "$PGROOT"
              printf 'cd /d "%%SRCWIN%%"\r\n'
              printf 'nmake /F Makefile.win\r\n'
              printf 'if errorlevel 1 exit /b 1\r\n'
              printf 'nmake /F Makefile.win install\r\n'
              printf 'if errorlevel 1 exit /b 1\r\n'
            } > "$WORK/build.bat"
            VSPATH="$VSPATH" SRCWIN="$(cygpath -w "$SRC")" \
              cmd //d //s //c "$(cygpath -w "$WORK/build.bat")" 2>&1 | tail -40
            rc=${PIPESTATUS[0]}
            echo "MEASURE windows nmake_exit=$rc nmake_seconds=$((SECONDS-t1))"
            if [ "$rc" != 0 ]; then
              echo "MEASURE windows verdict=FAILS route=2b-nmake"; exit 0
            fi
            echo "MEASURE windows vector_module=$(ls '/c/Program Files/PostgreSQL/17/lib' 2>/dev/null | grep -i '^vector\.' | tr '\n' ' ')"
            echo "MEASURE windows vector_control=$(ls '/c/Program Files/PostgreSQL/17/share/extension' 2>/dev/null | grep -i '^vector' | tr '\n' ' ')"
            echo "MEASURE windows pg_restore=$("$BIN/pg_restore.exe" --version)"
          fi

          # ── the cluster: identical on both systems once BIN is known ────────
          DATA="$WORK/data"
          printf 'gsd' > "$WORK/pw"
          if ! "$BIN/initdb$EXE" -D "$DATA" -U gsd \
               --auth-local=trust --auth-host=scram-sha-256 --pwfile="$WORK/pw" \
               --encoding=UTF8 --locale=C > "$WORK/initdb.log" 2>&1; then
            tail -30 "$WORK/initdb.log"
            echo "MEASURE ${{ runner.os }} verdict=FAILS route=initdb"; exit 0
          fi
          if ! "$BIN/pg_ctl$EXE" -D "$DATA" -l "$WORK/server.log" \
               -o "-p $PG_TEST_PORT -c listen_addresses=127.0.0.1" -w -t 90 start; then
            tail -30 "$WORK/server.log" || true
            echo "MEASURE ${{ runner.os }} verdict=FAILS route=pg_ctl-start"; exit 0
          fi
          ready=
          for _ in $(seq 1 45); do
            if python -c "import psycopg2; psycopg2.connect('postgresql://gsd:gsd@127.0.0.1:${PG_TEST_PORT}/postgres', connect_timeout=3).close()" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            tail -30 "$WORK/server.log" || true
            echo "MEASURE ${{ runner.os }} verdict=FAILS route=readiness"; exit 0
          fi
          export PGPASSWORD=gsd
          PSQL="$BIN/psql$EXE"
          Q() { "$PSQL" -h 127.0.0.1 -p "$PG_TEST_PORT" -U gsd -d "$1" -tAc "$2"; }
          "$PSQL" -h 127.0.0.1 -p "$PG_TEST_PORT" -U gsd -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE gsd_test OWNER gsd"
          "$PSQL" -h 127.0.0.1 -p "$PG_TEST_PORT" -U gsd -d gsd_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION vector"
          echo "MEASURE ${{ runner.os }} server_version=$(Q gsd_test 'SHOW server_version')"
          echo "MEASURE ${{ runner.os }} SELECT extversion FROM pg_extension WHERE extname='vector' -> $(Q gsd_test "SELECT extversion FROM pg_extension WHERE extname='vector'")"
          echo "MEASURE ${{ runner.os }} pg_search_in_pg_available_extensions=$(Q gsd_test "SELECT count(*) FROM pg_available_extensions WHERE name='pg_search'")"
          echo "MEASURE ${{ runner.os }} verdict=WORKS total_seconds=$((SECONDS-t0))"
          DSN="postgresql://gsd:gsd@127.0.0.1:${PG_TEST_PORT}/gsd_test"

          # Does the product's OWN migration path bootstrap `vector` and apply in
          # full on a server with no pg_search control file at all? Plan 89-06
          # could not measure this on a ParadeDB cluster.
          "$PSQL" -h 127.0.0.1 -p "$PG_TEST_PORT" -U gsd -d gsd_test -v ON_ERROR_STOP=1 \
            -c "DROP EXTENSION vector"
          echo "MEASURE ${{ runner.os }} vector_dropped_before_migrations=$(Q gsd_test "SELECT count(*) FROM pg_extension WHERE extname='vector'")"
          python - "$DSN" <<'PY'
          import sys
          sys.path.insert(0, '.')
          from services import infra_detect, migrate_runner
          dsn = sys.argv[1]
          ok, rep = infra_detect.check_pg_capabilities(dsn)
          print("MEASURE capabilities ok=%s lexical_engine=%s degradations=%s missing=%s pgvector=%s"
                % (ok, rep["lexical_engine"], rep["degradations"],
                   rep["extensions_missing"], rep["pgvector_version"]))
          r = migrate_runner.apply_migrations(dsn=dsn, log=lambda *a: None)
          print("MEASURE migrations total=%d applied=%d pending_left=%d"
                % (r["total"], len(r["applied"]), len(r["pending"]) - len(r["applied"])))
          PY
          echo "MEASURE ${{ runner.os }} vector_after_migrations=$(Q gsd_test "SELECT extversion FROM pg_extension WHERE extname='vector'")"
          echo "MEASURE ${{ runner.os }} fallback_indexes=$(Q gsd_test "SELECT string_agg(indexname, ' ' ORDER BY indexname) FROM pg_indexes WHERE indexname IN ('idx_rlm_chunks_fts','idx_gsd_memory_fts_fallback')")"
          echo "MEASURE ${{ runner.os }} bm25_indexes=$(Q gsd_test "SELECT count(*) FROM pg_indexes WHERE indexname IN ('bm25_test_idx','idx_rlm_chunks_bm25','idx_gsd_memory_bm25')")"
          echo "--- the literal error class for CREATE EXTENSION pg_search on a genuinely plain server"
          "$PSQL" -h 127.0.0.1 -p "$PG_TEST_PORT" -U gsd -d gsd_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION pg_search" 2>&1 | head -5 || true
          echo "--- the literal error class for the bm25 access method"
          "$PSQL" -h 127.0.0.1 -p "$PG_TEST_PORT" -U gsd -d gsd_test -v ON_ERROR_STOP=1 \
            -c "CREATE INDEX m89 ON bm25_test_table USING bm25 (id, content) WITH (key_field='id')" 2>&1 | head -5 || true

          "$BIN/pg_ctl$EXE" -D "$DATA" -m immediate stop || true
          echo "=== end 89-07-01 measurement"

      # ── TEMPORARY, plan 89-07-01: plan 89-04's routed install step, measured
      # before it is made permanent in task 89-07-03. 89-04-RECORD.md:1291-1332:
      # the runner's only pg_dump/pg_restore are 18.6 while the pinned
      # paradedb/paradedb:latest-pg16 server is 16.14, and pg_restore 18 cannot
      # load into a 16 server (`SET transaction_timeout = 0` in its fixed
      # preamble is a PostgreSQL 17 GUC). Five restore round-trip tests of plan
      # 89-04 therefore skip on every cell under reason_class
      # pg-client-major-mismatch.
      - name: MEASURE a major-16 PostgreSQL client (TEMPORARY, 89-07-01, Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "MEASURE linux pg_restore16=$(/usr/lib/postgresql/16/bin/pg_restore --version)"
          echo "MEASURE linux pg_dump16=$(/usr/lib/postgresql/16/bin/pg_dump --version)"
          echo "MEASURE linux pg_restore_on_path=$(pg_restore --version)"

      - name: Start the disposable PostgreSQL (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # GitHub service containers are declared at job level and would break
        # the macOS and Windows rows of this matrix, so the container is started
        # as a step instead.
        #
        # The image is the one docker/docker-compose.yml already pins BY DIGEST:
        # migration 011 does `CREATE EXTENSION pg_search`, which only ParadeDB
        # ships (and which needs shared_preload_libraries, already set in that
        # image — hence no `command:` override). `pgvector/pgvector:pg16` fails
        # 011 with `extension "pg_search" is not available`, measured on run
        # 43173591322. ParadeDB carries pgvector 0.8.1 too, so the vector
        # columns are covered. macOS and Windows are plan 88-16-04.
        run: |
          set -euo pipefail
          docker run -d --name gsd-test-pg \
            -e POSTGRES_USER=gsd -e POSTGRES_PASSWORD=gsd -e POSTGRES_DB=gsd_test \
            -p "127.0.0.1:${PG_TEST_PORT}:5432" \
            paradedb/paradedb:latest-pg16@sha256:21518b4005ad4111bdd41a6687ef37ca2abc363d7af30e700900ad6b8cb33e1e
          # Readiness is checked FROM THE HOST, with a real connection, not with
          # `docker exec pg_isready`. Measured on run 43178016790: the exec
          # probe answers the entrypoint's TEMPORARY init server, which listens
          # on the container's unix socket only; the published port is not
          # serving yet, and the next step died with "server closed the
          # connection unexpectedly". The condition that matters is the one the
          # next step needs, so that is the one to wait for.
          ready=
          for _ in $(seq 1 90); do
            if python -c "import psycopg2; psycopg2.connect('postgresql://gsd:gsd@127.0.0.1:${PG_TEST_PORT}/gsd_test', connect_timeout=3).close()" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            docker logs gsd-test-pg || true
            echo "the disposable PostgreSQL did not accept a host connection in 180 s" >&2
            exit 1
          fi
          docker exec gsd-test-pg psql -U gsd -d gsd_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
          echo "GSD_TEST_POSTGRES_URL=postgresql://gsd:gsd@127.0.0.1:${PG_TEST_PORT}/gsd_test" >> "$GITHUB_ENV"

      - name: Apply the schema to the disposable PostgreSQL
        if: env.GSD_TEST_POSTGRES_URL != ''
        shell: bash
        # The suite's Postgres tests expect the product's own schema. This runs
        # the repository's migration runner, so CI exercises the same code a
        # user runs. tests/test_docker_pg_migration.py is unaffected: it creates
        # and drops its OWN scratch database per test and never touches this one.
        run: |
          set -euo pipefail
          python -c "import sys; sys.path.insert(0, '.'); from services import migrate_runner; print('migrations applied:', migrate_runner.apply_migrations(dsn='${GSD_TEST_POSTGRES_URL}'))"

      - name: Run tests with coverage
        # c8 v11 requires Node 20+ (engines: ^20.0.0 || >=22.0.0).
        # Use bash on all platforms so shell glob expansion works on Windows.
        shell: bash
        run: npm run test:coverage

      - name: Run coverage ratchet
        shell: bash
        run: node scripts/coverage-ratchet.cjs

      # Plan 88-18 recorded that the Windows Node job ends with the runner saying
      # "Terminate orphan process: pid (N) (python)" twice. The ledger-based stray
      # detector in scripts/run-tests.cjs only sees daemons and RLM services it
      # recorded, so those two are invisible to it. This names them — command line
      # and parent — and reaps them, so the evidence exists for plan 88-11 instead
      # of a pid number with no identity. It never fails the job.
      - name: Name and reap surviving Python children (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $procs = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'python*' })
          if ($procs.Count -eq 0) { Write-Host 'no surviving python child'; exit 0 }
          foreach ($p in $procs) {
            Write-Host ("SURVIVING PYTHON pid={0} ppid={1} cmd={2}" -f $p.ProcessId, $p.ParentProcessId, $p.CommandLine)
          }
          foreach ($p in $procs) { Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue }
          Write-Host ("reaped {0} python process(es)" -f $procs.Count)

      - name: Stop the disposable PostgreSQL (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: docker rm -f gsd-test-pg || true

  pytest:
    name: pytest (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # Operator decision 2026-11-11 ("All needs to pass even windows ... this is
    # a universal tool"): the Python suite must run and pass on Linux, macOS
    # and Windows. Plan 88-15 flipped the macOS and Windows rows to required,
    # both green at that point. The ubuntu row was deliberately left for plan
    # 88-11 task 88-11-01 step 0, which is this flip. The job-level expression
    # stays an expression: a bare `continue-on-error: false` here would be a
    # second place to edit, and reintroducing one would override the two rows
    # 88-15 already made required. The literal check name
    # `pytest (ubuntu-latest, python 3.12)` is what the ruleset names.
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Blocking since Phase 88 task 88-11-01: the Python suite is green (88-08 dispositioned the suite, 88-10 the doctor tests, 88-16 removed the skips).
          - { os: ubuntu-latest,  python-version: '3.12', required: true }
          - { os: macos-latest,   python-version: '3.12', required: true }
          - { os: windows-latest, python-version: '3.12', required: true }
    steps:
      - name: Check out with LF line endings (88-13, research G4)
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Node dependencies
        run: npm ci
        env:
          GSD_INSTALL_FILES_ONLY: '1'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Pick a free host port for the disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          PORT=$(node -e "process.stdout.write(String(require('./scripts/run-tests.cjs').freePort()))")
          echo "PG_TEST_PORT=$PORT" >> "$GITHUB_ENV"
          echo "disposable PostgreSQL will listen on host port $PORT"

      - name: Probe the runner's PostgreSQL capability (macOS and Windows)
        if: runner.os != 'Linux'
        continue-on-error: true
        shell: bash
        # Plan 88-16-04 measures before it chooses. The research marks the
        # pgvector-on-Windows question LOW confidence and `ankane/setup-postgres`
        # MEDIUM; both are hypotheses, and this step is how they stop being
        # hypotheses. continue-on-error so a missing tool reports rather than
        # fails the cell.
        run: |
          echo "=== runner: ${{ runner.os }} / ${{ runner.arch }}"
          echo "--- postgres --version";  postgres --version  2>&1 || echo "(absent)"
          echo "--- pg_ctl --version";    pg_ctl --version    2>&1 || echo "(absent)"
          echo "--- initdb --version";    initdb --version    2>&1 || echo "(absent)"
          echo "--- pg_config --version"; pg_config --version 2>&1 || echo "(absent)"
          echo "--- pg_config --pkglibdir / --sharedir"
          pg_config --pkglibdir 2>&1 || true
          pg_config --sharedir 2>&1 || true
          echo "--- PGBIN=${PGBIN:-<unset>} PGROOT=${PGROOT:-<unset>} PGDATA=${PGDATA:-<unset>}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "--- brew list | grep -i postgres"; brew list 2>/dev/null | grep -i postgres || echo "(none)"
            echo "--- brew info pgvector";          brew info pgvector 2>&1 | head -5 || echo "(no formula)"
            echo "--- which psql";                  command -v psql || echo "(absent)"
          else
            echo "--- windows service state";       powershell -NoProfile -Command "Get-Service postgresql* | Format-Table -AutoSize" 2>&1 || true
            echo "--- nmake on PATH";               command -v nmake || echo "(absent)"
            echo "--- cl on PATH";                  command -v cl || echo "(absent)"
            echo "--- vswhere";                     "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath 2>&1 || echo "(absent)"
            echo "--- conda";                       command -v conda || echo "(absent)"
            echo "--- wsl";                         command -v wsl || echo "(absent)"
            echo "--- docker info OSType";          docker info --format '{{.OSType}}' 2>&1 || echo "(absent)"
          fi
          echo "=== end capability probe"
      # ── TEMPORARY, plan 89-07-01: MEASURE, never configure ──────────────────
      # Task 89-07-03 DELETES this step and replaces it with the permanent
      # `scripts/ci-postgres-cell.cjs` bring-up. Until then nothing here is
      # exported to $GITHUB_ENV, so every later step of the cell behaves exactly
      # as it does on master and this step only answers one question: can a
      # disposable PostgreSQL with `vector` be had on this runner at all?
      #
      # pgvector is pinned to 0.8.7 and verified against the SHA-256 that
      # Homebrew core publishes for the SAME tarball (Formula/p/pgvector.rb:
      # url + sha256). That is an INDEPENDENT record of the digest, not one
      # computed from the download being verified.
      - name: MEASURE a disposable PostgreSQL + pgvector (TEMPORARY, 89-07-01)
        if: runner.os != 'Linux'
        continue-on-error: true
        shell: bash
        env:
          PGV_VER: '0.8.7'
          PGV_SHA: 'cac0b10c360f05b2d521200105ba3697e773d4cd3731f5a915a7e37ebe0bea85'
        run: |
          set -uo pipefail
          echo "=== 89-07-01 measurement on ${{ runner.os }} / ${{ runner.arch }}"
          WORK="$RUNNER_TEMP/pg8907"
          rm -rf "$WORK"; mkdir -p "$WORK"
          t0=$SECONDS
          EXE=""

          if [ "${{ runner.os }}" = "macOS" ]; then
            export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1
            echo "--- route macOS-1: brew install postgresql@17 pgvector"
            if ! brew install postgresql@17 pgvector; then
              echo "MEASURE macos verdict=FAILS route=brew-install"; exit 0
            fi
            echo "MEASURE macos brew_seconds=$((SECONDS-t0))"
            BIN="$(brew --prefix postgresql@17)/bin"
            PKGLIB="$("$BIN/pg_config" --pkglibdir)"
            SHARE="$("$BIN/pg_config" --sharedir)"
            echo "MEASURE macos pg_config=$("$BIN/pg_config" --version)"
            echo "MEASURE macos homebrew_prefix=$(brew --prefix)"
            echo "MEASURE macos pkglibdir=$PKGLIB"
            echo "MEASURE macos sharedir=$SHARE"
            echo "MEASURE macos pgvector_brew=$(brew list --versions pgvector | tr '\n' ' ')"
            echo "MEASURE macos vector_module=$(ls "$PKGLIB" 2>/dev/null | grep -i '^vector\.' | tr '\n' ' ')"
            echo "MEASURE macos vector_control=$(ls "$SHARE/extension" 2>/dev/null | grep -i '^vector' | tr '\n' ' ')"
            echo "MEASURE macos pg_restore=$("$BIN/pg_restore" --version)"
          else
            EXE=".exe"
            PGROOT='C:\Program Files\PostgreSQL\17'
            BIN='/c/Program Files/PostgreSQL/17/bin'
            echo "--- route Windows-1: the PREINSTALLED PostgreSQL 17 binaries, a FRESH disposable cluster (NOT the stopped postgresql-x64-17 service: its cluster is not disposable and it would listen on 5432, not on the port freePort() chose)"
            if ! "$BIN/initdb.exe" --version; then
              echo "MEASURE windows verdict=FAILS route=1-initdb-absent"; exit 0
            fi
            for f in include/server/postgres.h lib/postgres.lib; do
              if [ -f "/c/Program Files/PostgreSQL/17/$f" ]; then
                echo "MEASURE windows devfile $f=present"
              else
                echo "MEASURE windows devfile $f=ABSENT"
              fi
            done
            echo "--- route Windows-2a: a prebuilt, digest-pinned pgvector for PG17 x64"
            echo "MEASURE windows route_2a=NOT USED -- github.com/pgvector/pgvector publishes source archives only; no release carries a Windows .zip or .dll asset, so NO artefact digest could be recorded, and an unverifiable artefact was not used"
            echo "--- route Windows-2b: nmake /F Makefile.win through vcvars64.bat located with vswhere"
            t1=$SECONDS
            curl -fsSL --retry 3 --retry-all-errors -o "$WORK/pgvector.tar.gz" \
              "https://github.com/pgvector/pgvector/archive/refs/tags/v${PGV_VER}.tar.gz"
            echo "MEASURE windows pgvector_sha256_measured=$(sha256sum "$WORK/pgvector.tar.gz" | cut -d' ' -f1)"
            echo "MEASURE windows pgvector_sha256_pinned=$PGV_SHA"
            if ! printf '%s  %s\n' "$PGV_SHA" "$WORK/pgvector.tar.gz" | sha256sum -c -; then
              echo "MEASURE windows verdict=FAILS route=2b-digest-mismatch"; exit 0
            fi
            tar -xzf "$WORK/pgvector.tar.gz" -C "$WORK"
            SRC="$WORK/pgvector-${PGV_VER}"
            VSWHERE='/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
            VSPATH="$("$VSWHERE" -latest -products '*' \
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
              -property installationPath | tr -d '\r')"
            echo "MEASURE windows vs_installationPath=$VSPATH"
            {
              printf '@echo off\r\n'
              printf 'call "%%VSPATH%%\\VC\\Auxiliary\\Build\\vcvars64.bat" >nul\r\n'
              printf 'if errorlevel 1 exit /b 1\r\n'
              printf 'set "PGROOT=%s"\r\n' "$PGROOT"
              printf 'cd /d "%%SRCWIN%%"\r\n'
              printf 'nmake /F Makefile.win\r\n'
              printf 'if errorlevel 1 exit /b 1\r\n'
              printf 'nmake /F Makefile.win install\r\n'
              printf 'if errorlevel 1 exit /b 1\r\n'
            } > "$WORK/build.bat"
            VSPATH="$VSPATH" SRCWIN="$(cygpath -w "$SRC")" \
              cmd //d //s //c "$(cygpath -w "$WORK/build.bat")" 2>&1 | tail -40
            rc=${PIPESTATUS[0]}
            echo "MEASURE windows nmake_exit=$rc nmake_seconds=$((SECONDS-t1))"
            if [ "$rc" != 0 ]; then
              echo "MEASURE windows verdict=FAILS route=2b-nmake"; exit 0
            fi
            echo "MEASURE windows vector_module=$(ls '/c/Program Files/PostgreSQL/17/lib' 2>/dev/null | grep -i '^vector\.' | tr '\n' ' ')"
            echo "MEASURE windows vector_control=$(ls '/c/Program Files/PostgreSQL/17/share/extension' 2>/dev/null | grep -i '^vector' | tr '\n' ' ')"
            echo "MEASURE windows pg_restore=$("$BIN/pg_restore.exe" --version)"
          fi

          # ── the cluster: identical on both systems once BIN is known ────────
          DATA="$WORK/data"
          printf 'gsd' > "$WORK/pw"
          if ! "$BIN/initdb$EXE" -D "$DATA" -U gsd \
               --auth-local=trust --auth-host=scram-sha-256 --pwfile="$WORK/pw" \
               --encoding=UTF8 --locale=C > "$WORK/initdb.log" 2>&1; then
            tail -30 "$WORK/initdb.log"
            echo "MEASURE ${{ runner.os }} verdict=FAILS route=initdb"; exit 0
          fi
          if ! "$BIN/pg_ctl$EXE" -D "$DATA" -l "$WORK/server.log" \
               -o "-p $PG_TEST_PORT -c listen_addresses=127.0.0.1" -w -t 90 start; then
            tail -30 "$WORK/server.log" || true
            echo "MEASURE ${{ runner.os }} verdict=FAILS route=pg_ctl-start"; exit 0
          fi
          ready=
          for _ in $(seq 1 45); do
            if python -c "import psycopg2; psycopg2.connect('postgresql://gsd:gsd@127.0.0.1:${PG_TEST_PORT}/postgres', connect_timeout=3).close()" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            tail -30 "$WORK/server.log" || true
            echo "MEASURE ${{ runner.os }} verdict=FAILS route=readiness"; exit 0
          fi
          export PGPASSWORD=gsd
          PSQL="$BIN/psql$EXE"
          Q() { "$PSQL" -h 127.0.0.1 -p "$PG_TEST_PORT" -U gsd -d "$1" -tAc "$2"; }
          "$PSQL" -h 127.0.0.1 -p "$PG_TEST_PORT" -U gsd -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE gsd_test OWNER gsd"
          "$PSQL" -h 127.0.0.1 -p "$PG_TEST_PORT" -U gsd -d gsd_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION vector"
          echo "MEASURE ${{ runner.os }} server_version=$(Q gsd_test 'SHOW server_version')"
          echo "MEASURE ${{ runner.os }} SELECT extversion FROM pg_extension WHERE extname='vector' -> $(Q gsd_test "SELECT extversion FROM pg_extension WHERE extname='vector'")"
          echo "MEASURE ${{ runner.os }} pg_search_in_pg_available_extensions=$(Q gsd_test "SELECT count(*) FROM pg_available_extensions WHERE name='pg_search'")"
          echo "MEASURE ${{ runner.os }} verdict=WORKS total_seconds=$((SECONDS-t0))"
          DSN="postgresql://gsd:gsd@127.0.0.1:${PG_TEST_PORT}/gsd_test"

          # Does the product's OWN migration path bootstrap `vector` and apply in
          # full on a server with no pg_search control file at all? Plan 89-06
          # could not measure this on a ParadeDB cluster.
          "$PSQL" -h 127.0.0.1 -p "$PG_TEST_PORT" -U gsd -d gsd_test -v ON_ERROR_STOP=1 \
            -c "DROP EXTENSION vector"
          echo "MEASURE ${{ runner.os }} vector_dropped_before_migrations=$(Q gsd_test "SELECT count(*) FROM pg_extension WHERE extname='vector'")"
          python - "$DSN" <<'PY'
          import sys
          sys.path.insert(0, '.')
          from services import infra_detect, migrate_runner
          dsn = sys.argv[1]
          ok, rep = infra_detect.check_pg_capabilities(dsn)
          print("MEASURE capabilities ok=%s lexical_engine=%s degradations=%s missing=%s pgvector=%s"
                % (ok, rep["lexical_engine"], rep["degradations"],
                   rep["extensions_missing"], rep["pgvector_version"]))
          r = migrate_runner.apply_migrations(dsn=dsn, log=lambda *a: None)
          print("MEASURE migrations total=%d applied=%d pending_left=%d"
                % (r["total"], len(r["applied"]), len(r["pending"]) - len(r["applied"])))
          PY
          echo "MEASURE ${{ runner.os }} vector_after_migrations=$(Q gsd_test "SELECT extversion FROM pg_extension WHERE extname='vector'")"
          echo "MEASURE ${{ runner.os }} fallback_indexes=$(Q gsd_test "SELECT string_agg(indexname, ' ' ORDER BY indexname) FROM pg_indexes WHERE indexname IN ('idx_rlm_chunks_fts','idx_gsd_memory_fts_fallback')")"
          echo "MEASURE ${{ runner.os }} bm25_indexes=$(Q gsd_test "SELECT count(*) FROM pg_indexes WHERE indexname IN ('bm25_test_idx','idx_rlm_chunks_bm25','idx_gsd_memory_bm25')")"
          echo "--- the literal error class for CREATE EXTENSION pg_search on a genuinely plain server"
          "$PSQL" -h 127.0.0.1 -p "$PG_TEST_PORT" -U gsd -d gsd_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION pg_search" 2>&1 | head -5 || true
          echo "--- the literal error class for the bm25 access method"
          "$PSQL" -h 127.0.0.1 -p "$PG_TEST_PORT" -U gsd -d gsd_test -v ON_ERROR_STOP=1 \
            -c "CREATE INDEX m89 ON bm25_test_table USING bm25 (id, content) WITH (key_field='id')" 2>&1 | head -5 || true

          # ── the counts the arithmetic of task 89-07-04 needs, FROM A CELL ───
          # The subset is derived from the ledger itself, so it cannot drift:
          # every distinct `file` in the union of tests/skip-exceptions.d/*.json
          # whose reason_class is pg-no-disposable-database.
          SUBSET="$(node -e "
            const fs = require('fs'), d = 'tests/skip-exceptions.d';
            const u = fs.readdirSync(d).filter((f) => f.endsWith('.json'))
              .flatMap((f) => JSON.parse(fs.readFileSync(d + '/' + f, 'utf8')));
            const files = [...new Set(u
              .filter((x) => x.reason_class === 'pg-no-disposable-database')
              .map((x) => x.file))].filter((f) => f.endsWith('.py')).sort();
            process.stdout.write(files.join('\n'));
          ")"
          echo "MEASURE ${{ runner.os }} subset_py_files=$(printf '%s\n' "$SUBSET" | grep -c .)"
          GSD_TEST_POSTGRES_URL="$DSN" python3 -m pytest $SUBSET \
            -q -rs -p no:cacheprovider 2>&1 | tail -45
          echo "MEASURE ${{ runner.os }} subset_exit=${PIPESTATUS[0]}"

          "$BIN/pg_ctl$EXE" -D "$DATA" -m immediate stop || true
          echo "=== end 89-07-01 measurement"

      # ── TEMPORARY, plan 89-07-01: plan 89-04's routed install step, measured
      # before it is made permanent in task 89-07-03. 89-04-RECORD.md:1291-1332:
      # the runner's only pg_dump/pg_restore are 18.6 while the pinned
      # paradedb/paradedb:latest-pg16 server is 16.14, and pg_restore 18 cannot
      # load into a 16 server (`SET transaction_timeout = 0` in its fixed
      # preamble is a PostgreSQL 17 GUC). Five restore round-trip tests of plan
      # 89-04 therefore skip on every cell under reason_class
      # pg-client-major-mismatch.
      - name: MEASURE a major-16 PostgreSQL client (TEMPORARY, 89-07-01, Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "MEASURE linux pg_restore16=$(/usr/lib/postgresql/16/bin/pg_restore --version)"
          echo "MEASURE linux pg_dump16=$(/usr/lib/postgresql/16/bin/pg_dump --version)"
          echo "MEASURE linux pg_restore_on_path=$(pg_restore --version)"


      - name: Start the disposable PostgreSQL (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name gsd-test-pg \
            -e POSTGRES_USER=gsd -e POSTGRES_PASSWORD=gsd -e POSTGRES_DB=gsd_test \
            -p "127.0.0.1:${PG_TEST_PORT}:5432" \
            paradedb/paradedb:latest-pg16@sha256:21518b4005ad4111bdd41a6687ef37ca2abc363d7af30e700900ad6b8cb33e1e
          # Readiness is checked FROM THE HOST, with a real connection, not with
          # `docker exec pg_isready`. Measured on run 43178016790: the exec
          # probe answers the entrypoint's TEMPORARY init server, which listens
          # on the container's unix socket only; the published port is not
          # serving yet, and the next step died with "server closed the
          # connection unexpectedly". The condition that matters is the one the
          # next step needs, so that is the one to wait for.
          ready=
          for _ in $(seq 1 90); do
            if python -c "import psycopg2; psycopg2.connect('postgresql://gsd:gsd@127.0.0.1:${PG_TEST_PORT}/gsd_test', connect_timeout=3).close()" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            docker logs gsd-test-pg || true
            echo "the disposable PostgreSQL did not accept a host connection in 180 s" >&2
            exit 1
          fi
          docker exec gsd-test-pg psql -U gsd -d gsd_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
          echo "GSD_TEST_POSTGRES_URL=postgresql://gsd:gsd@127.0.0.1:${PG_TEST_PORT}/gsd_test" >> "$GITHUB_ENV"

      - name: Start the disposable Valkey (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # Plan 88-11 (B2). The RLM graph leg (services/rlm_graph.py) stores its
        # caller/callee adjacency in Valkey, and with no server the graph
        # degrades by design (RETR-05) -- which is a real behaviour, but it
        # meant `test_graph_names_the_real_caller` had never once asserted the
        # POSITIVE case on any cell.
        #
        # The host port is chosen by the runner's OWN freePort(), which excludes
        # the live service ports by construction, so it can never be 6379 --
        # the operator's live Redis, which the hermetic guard blocks and which
        # no test may dial. The address travels in GSD_TEST_VALKEY_URL and
        # NOTHING defaults to it: tests/conftest.py validates it against the
        # live ports, hands it to the fixture RLM as REDIS_HOST/REDIS_PORT, and
        # returns None (a named skip) when it is unset. The image is pinned by
        # digest, like the PostgreSQL one above.
        run: |
          set -euo pipefail
          VK_PORT=$(node -e "process.stdout.write(String(require('./scripts/run-tests.cjs').freePort()))")
          if [ "$VK_PORT" = "6379" ]; then
            echo "freePort() returned the live Redis port; refusing to continue" >&2
            exit 1
          fi
          docker run -d --name gsd-test-valkey \
            -p "127.0.0.1:${VK_PORT}:6379" \
            valkey/valkey:8.1-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a \
            valkey-server --save '' --appendonly no
          ready=
          for _ in $(seq 1 30); do
            if python -c "import socket,sys; s=socket.create_connection(('127.0.0.1', ${VK_PORT}), 2); s.sendall(b'PING\r\n'); sys.exit(0 if b'PONG' in s.recv(64) else 1)" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            docker logs gsd-test-valkey || true
            echo "the disposable Valkey did not answer PING on 127.0.0.1:${VK_PORT} in 60 s" >&2
            exit 1
          fi
          echo "GSD_TEST_VALKEY_URL=redis://127.0.0.1:${VK_PORT}/0" >> "$GITHUB_ENV"
          echo "disposable Valkey answering on host port ${VK_PORT}"

      - name: Apply the schema to the disposable PostgreSQL
        if: env.GSD_TEST_POSTGRES_URL != ''
        shell: bash
        # The suite's Postgres tests expect the product's own schema. This runs
        # the repository's migration runner, so CI exercises the same code a
        # user runs. tests/test_docker_pg_migration.py is unaffected: it creates
        # and drops its OWN scratch database per test and never touches this one.
        run: |
          set -euo pipefail
          python -c "import sys; sys.path.insert(0, '.'); from services import migrate_runner; print('migrations applied:', migrate_runner.apply_migrations(dsn='${GSD_TEST_POSTGRES_URL}'))"

      - name: Run the Python suite
        shell: bash
        # `set -e` is deliberately OFF so the exit code can be captured and
        # echoed, but the step MUST still fail when pytest fails: capture $?
        # into a variable immediately (any command in between overwrites it)
        # and exit with it. A step that ends on `echo` always exits 0, which
        # is how a continue-on-error job silently becomes a permanently green one.
        # `-rs` puts every skip reason in the log (plan 88-16 needs them).
        run: |
          set -uo pipefail
          python3 -m pytest tests -q -rs -p no:cacheprovider --junitxml=pytest-report.xml
          rc=$?
          echo "pytest exit: $rc"
          exit $rc

      - name: Run the embedding-provider test against the real Voyage API
        shell: bash
        # Plan 88-16-08, operator decision 2026-11-11 "there is a key, use it".
        #
        # Its OWN step, and the wiring is deliberate in three ways:
        #  * the secret is on THIS step only, so it never reaches the ~1,800
        #    other test subprocesses in the suite;
        #  * this step writes NO --junitxml and uploads NO artifact. GitHub's
        #    secret masking covers logs, not artifact content, and the main
        #    step's report IS uploaded;
        #  * the main suite step above therefore has no key at all and always
        #    exercises the deterministic stand-in, so BOTH paths run on every
        #    cell of every run.
        #
        # On a fork PR the secret expands to the empty string and this step
        # takes the stand-in path too — green either way, and the record says
        # which path each cell took. One short input, one call per job.
        #
        # Plan 89-01 added tests/test_89_01_relevance_check.py to this step.
        # RET-02's relevance check has to produce a number for plan 89-08's
        # blue/green gate, and a number measured on hash-derived stand-in
        # vectors measures the PIPELINE, not the vectors — so its real-provider
        # arm has to run where the key is, and this is the only step that has
        # one. The existing `-k` already selects it: the arm is named
        # `…_with_the_real_embedding_provider`, so `embedding_provider` matches
        # it and every other test in that file stays deselected. The arm runs
        # over a SAMPLE (two queries, six documents) to keep this step short,
        # and it needs a database, so on the macOS and Windows cells it skips
        # before any call is made.
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          set -uo pipefail
          python3 -m pytest tests/test_65_vector_leg.py tests/test_89_01_relevance_check.py \
            -p no:cacheprovider -q \
            -k "embedding_provider or allowance_did_not_leak or stand_in_is_deterministic"
          rc=$?
          echo "voyage-path pytest exit: $rc"
          exit $rc

      - name: Upload the pytest report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report-${{ matrix.os }}
          path: pytest-report.xml

      - name: Stop the disposable PostgreSQL (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: docker rm -f gsd-test-pg || true

      - name: Stop the disposable Valkey (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: docker rm -f gsd-test-valkey || true
