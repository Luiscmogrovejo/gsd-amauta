name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ !matrix.required }}

    strategy:
      # Source of the matrix decision: .planning/phases/88-foundation-hermetic-ci/88-CONTEXT.md
      # (locked 2026-11-11). Node 18 is gone: package.json engines.node is
      # >=20 and Node 18 is end of life. ubuntu and macos on Node 20 and 22 are
      # required cells. Windows is a supported platform (operator decision
      # 2026-11-11: "All needs to pass even windows ... this is a universal
      # tool"), so both Windows cells are on their way to required: they stay
      # `required: false` only while plans 88-13 to 88-14 drive their failing
      # set to zero, and plan 88-15 flips them to required. fail-fast is off
      # so one red cell cannot cancel (and hide) the others.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node-version: 20, required: true }
          - { os: ubuntu-latest, node-version: 22, required: true }
          - { os: macos-latest, node-version: 20, required: true }
          - { os: macos-latest, node-version: 22, required: true }
          - { os: windows-latest, node-version: 22, required: false }
          - { os: windows-latest, node-version: 20, required: false }

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the party/phase canary tests run `git show <sha>`
          # against historical commits and fail on the default depth-1 clone.
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The Node tests shell out to python3 and need PyYAML and pydantic (module
      # manifest hashing and validation). The runners' system Python is PEP 668
      # "externally managed" (a bare pip install fails) and windows-latest may
      # have no python3 on PATH, so give the job its own Python first. Same SHA
      # pin as the pytest job.
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'

      - name: Install the Python packages the Node tests import
        shell: bash
        run: python -m pip install --disable-pip-version-check pyyaml pydantic

      - name: Run tests with coverage
        # c8 v11 requires Node 20+ (engines: ^20.0.0 || >=22.0.0).
        # Use bash on all platforms so shell glob expansion works on Windows.
        shell: bash
        run: npm run test:coverage

      - name: Run coverage ratchet
        shell: bash
        run: node scripts/coverage-ratchet.cjs

  pytest:
    name: pytest (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # Every row is non-required for now. Operator decision 2026-11-11 ("All
    # needs to pass even windows ... this is a universal tool"): the Python
    # suite must run and pass on Linux, macOS and Windows. The macOS and
    # Windows rows start here to get a measured baseline (88-PYTEST-BASELINE.md
    # is the ubuntu one); plan 88-15 flips the macOS and Windows rows to
    # required and plan 88-11 flips the ubuntu row, which keeps the literal
    # check name `pytest (ubuntu-latest, python 3.12)` that the ruleset names.
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python-version: '3.12', required: false }
          - { os: macos-latest,   python-version: '3.12', required: false }
          - { os: windows-latest, python-version: '3.12', required: false }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Node dependencies
        run: npm ci
        env:
          GSD_INSTALL_FILES_ONLY: '1'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the Python suite
        shell: bash
        # `set -e` is deliberately OFF so the exit code can be captured and
        # echoed, but the step MUST still fail when pytest fails: capture $?
        # into a variable immediately (any command in between overwrites it)
        # and exit with it. A step that ends on `echo` always exits 0, which
        # is how a continue-on-error job silently becomes a permanently green one.
        # `-rs` puts every skip reason in the log (plan 88-16 needs them).
        run: |
          set -uo pipefail
          python3 -m pytest tests -q -rs -p no:cacheprovider --junitxml=pytest-report.xml
          rc=$?
          echo "pytest exit: $rc"
          exit $rc

      - name: Upload the pytest report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report-${{ matrix.os }}
          path: pytest-report.xml
