name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ !matrix.required }}

    strategy:
      # Source of the matrix decision: .planning/phases/88-foundation-hermetic-ci/88-CONTEXT.md
      # (locked 2026-11-11). Node 18 is gone: package.json engines.node is
      # >=20 and Node 18 is end of life. ubuntu and macos on Node 20 and 22 are
      # required cells. Windows (Node 22) is non-blocking: its result is
      # reported, and it becomes required only if it is green without
      # Windows-only rewrites. fail-fast is off so one red cell cannot cancel
      # (and hide) the others.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node-version: 20, required: true }
          - { os: ubuntu-latest, node-version: 22, required: true }
          - { os: macos-latest, node-version: 20, required: true }
          - { os: macos-latest, node-version: 22, required: true }
          - { os: windows-latest, node-version: 22, required: false }

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the party/phase canary tests run `git show <sha>`
          # against historical commits and fail on the default depth-1 clone.
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # c8 v11 requires Node 20+ (engines: ^20.0.0 || >=22.0.0).
        # Use bash on all platforms so shell glob expansion works on Windows.
        shell: bash
        run: npm run test:coverage

      - name: Run coverage ratchet
        shell: bash
        run: node scripts/coverage-ratchet.cjs

  pytest:
    name: pytest (ubuntu-latest, python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Non-blocking for now: the Python baseline is unmeasured (88-CONTEXT.md).
    # Plan 88-08 dispositions the failures; the flip to
    # `continue-on-error: false` belongs to plan 88-11, because the suite is
    # only fully green after 88-10 lands the doctor tests.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci
        env:
          GSD_INSTALL_FILES_ONLY: '1'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the Python suite
        shell: bash
        # `set -e` is deliberately OFF so the exit code can be captured and
        # echoed, but the step MUST still fail when pytest fails: capture $?
        # into a variable immediately (any command in between overwrites it)
        # and exit with it. A step that ends on `echo` always exits 0, which
        # is how a non-blocking job silently becomes a permanently green one.
        run: |
          set -uo pipefail
          python3 -m pytest tests -q -p no:cacheprovider --junitxml=pytest-report.xml
          rc=$?
          echo "pytest exit: $rc"
          exit $rc

      - name: Upload the pytest report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report
          path: pytest-report.xml
