name: Release — npm publish with provenance

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      id-token: write   # Required for npm --provenance (OIDC token)
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Node.js tests
        shell: bash
        run: npm test

      - name: Run coverage ratchet
        shell: bash
        run: node scripts/coverage-ratchet.cjs

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          if [ -f services/requirements.txt ]; then
            pip install -r services/requirements.txt
          fi

      - name: Run Python tests
        run: |
          if [ -d services ] && ls services/test_*.py 1>/dev/null 2>&1; then
            python -m pytest services/ -v --tb=short
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
