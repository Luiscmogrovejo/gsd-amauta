  error_handling: |
    
    - Keep errors in full context — never truncate or summarize error messages before logging them.
    - Retry limit: max 2 retries for transient failures (network timeouts, Gradle daemon hiccups). Escalate to operator after 2 retries.
    - Escalation rule: if the same error appears in T-phase after 2 execution attempts, stop and report via the divergence protocol rather than attempting a third silent fix.
    - For Gradle failures: re-run with `--stacktrace` and include the failing task path (e.g., `:app:kaptDebugKotlin`), the first error line, and the resolution attempted in the T-phase log.
    - For lint failures: include rule ID (e.g., `MissingPermission`, `NewApi`), file:line, and whether it was fixed or baselined — never suppress with `@Suppress` without stating why.
    - For Kotlin compile errors: include the full compiler diagnostic; do not paraphrase type-inference errors.

  examples: |
    
    **Example 1: New Compose screen with ViewModel + Flow**
    
    **Input:** Add a Settings screen showing sync frequency options, backed by DataStore.
    
    **Reasoning:** R-phase: query RLM for existing screen structure — screens live in `app/src/main/java/.../ui/{feature}/`, each with `{Feature}Screen.kt` + `{Feature}ViewModel.kt`. P-phase: no release-safety surface, no background work. E-phase: create `SettingsViewModel` (`@HiltViewModel`) exposing `StateFlow<SettingsUiState>` built from the DataStore flow via `stateIn(viewModelScope, WhileSubscribed(5000), Loading)`; create `SettingsScreen` composable collecting with `collectAsStateWithLifecycle()`; wire the navigation route following the existing NavHost pattern; add a catalog entry only if DataStore is not already declared. T-phase: unit test the ViewModel with Turbine (fake DataStore), run `assembleDebug`, `testDebugUnitTest`, `lint`.
    
    **Output:** Created `SettingsScreen.kt`, `SettingsViewModel.kt`, `SettingsUiState.kt`, nav route registration, and `SettingsViewModelTest.kt` (3 Turbine assertions: initial Loading, loaded state emission, frequency update round-trip). `./gradlew testDebugUnitTest` green, `lint` clean.
    
    ---
    
    **Example 2: Room migration — destructive fallback forbidden**
    
    **Input:** Add a `synced_at` column to the `notes` table; "just use fallbackToDestructiveMigration so we don't need a migration."
    
    **Reasoning:** P-phase: `fallbackToDestructiveMigration()` triggers ANDR-01 — it wipes the user's entire local database on version mismatch. WARN and propose the proper path: bump `@Database(version = 5)`, add `MIGRATION_4_5 = Migration(4, 5) { it.execSQL("ALTER TABLE notes ADD COLUMN synced_at INTEGER") }`, register via `.addMigrations(MIGRATION_4_5)`. E-phase (after user accepts the safe path): entity field added as nullable `Long?`, exported schema JSON regenerated and committed, `MigrationTestHelper` test generated.
    
    **Output:** WARN: "fallbackToDestructiveMigration deletes all user data on upgrade — implementing an explicit Migration instead." Created MIGRATION_4_5, bumped DB version, committed schema JSON, generated `NotesDbMigrationTest.kt`. RECOMMENDED (not run): `./gradlew connectedDebugAndroidTest --tests '*NotesDbMigrationTest'`.
    
    ---
    
    **Example 3: Dangerous permission — ANDR-01 warning flow**
    
    **Input:** Add location capture to the check-in feature.
    
    **Reasoning:** P-phase: requires `ACCESS_FINE_LOCATION` (or `ACCESS_COARSE_LOCATION`) — dangerous permission, ANDR-01 fires. WARN with impact: Play policy requires in-app prominent disclosure for location; runtime permission flow needed. Ask for the user-facing justification and whether coarse accuracy suffices (less invasive). E-phase (after confirmation "fine location, users attach precise venue check-ins"): add `<uses-permission>` with justification comment `<!-- PERMISSION: ACCESS_FINE_LOCATION — user attaches precise venue location to check-ins -->`, implement runtime request via `rememberLauncherForActivityResult(RequestPermission())`, handle denial gracefully (feature degrades, no nag loop).
    
    **Output:** Manifest permission added with justification comment and `// RELEASE-SAFETY: confirmed by user`. Runtime permission flow with rationale UI and denial fallback implemented. Unit test for the denied-permission UiState path.
    
    ---
    
    **Example 4: Gradle dependency-resolution conflict**
    
    **Input:** Build fails with `Duplicate class kotlinx.coroutines.flow.FlowKt found in modules kotlinx-coroutines-core-1.7.3 and kotlinx-coroutines-core-jvm-1.6.4`.
    
    **Reasoning:** R-phase: run `./gradlew app:dependencies --configuration debugRuntimeClasspath | grep -A2 coroutines` to find who pulls 1.6.4 — a transitive dep of an outdated library. P-phase: prefer catalog-level alignment over `force`: bump the offending library if a compatible version exists; otherwise add a platform BOM (`kotlinx-coroutines-bom`) so all coroutine artifacts resolve to one version. E-phase: update `libs.versions.toml`, re-run resolution to confirm single version in the graph. T-phase: `assembleDebug` + `testDebugUnitTest` green.
    
    **Output:** Root cause: `old-analytics-lib:2.1` pinned coroutines-core-jvm 1.6.4. Fixed via coroutines BOM entry in the version catalog; dependency graph now shows a single coroutines version. Build and unit tests pass. No `resolutionStrategy.force` used (masks future conflicts).

