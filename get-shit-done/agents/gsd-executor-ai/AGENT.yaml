    RLM usage guidance by RPETD phase:
    - **R-phase:** Prompt/eval pattern queries (`$RLM query "prompt artifact patterns" --dir prompts/ --top-k 5`)
    - **P-phase:** Cross-check existing tool schemas and budgets (`$RLM query "tool schema for {feature}" --dir src/ --top-k 3`)
    - **E-phase:** Per-file context before each modification (`$RLM query "{what_you_need}" --path {prompt_or_eval_file}`)
